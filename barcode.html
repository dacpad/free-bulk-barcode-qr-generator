<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barcode | DacPad</title>
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" type="image/png" href="https://dacpad.in/images/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #0F172A;
            --accent: #2563EB;
            --success: #10B981;
            --danger: #EF4444;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 80px; 
        }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;}
        .menu-btn { background: none; border: none; padding: 0; cursor: pointer; color: var(--primary); display: flex; align-items: center; }
        .header-title { font-size: 18px; font-weight: 700; margin: 0; }

        /* --- LAYOUT & PAGES --- */
        .container { padding: 20px; }
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI ELEMENTS --- */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-main); font-size: 15px; outline: none; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { height: 120px; resize: vertical; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: white; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
        .btn-outline { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); transition: all 0.2s ease; }
        
        /* NEW: Fills the button with color while it is being pressed! */
        .btn-outline:active { 
            background: var(--accent) !important; 
            color: white !important; 
            transform: scale(0.96); /* Adds a tiny 'push down' animation */
        }
        
        .btn-danger { background: #FEF2F2; color: var(--danger); border: 1px solid #FECACA; padding: 8px 12px; font-size: 13px; border-radius: 8px; }

        /* --- BARCODE CARDS --- */
        .saved-list { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .barcode-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .barcode-card svg { max-width: 100%; height: auto; }
        
        .bulk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .qr-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .qr-card img { max-width: 100%; margin-bottom: 10px; }
        .qr-label { font-size: 12px; font-weight: 600; word-break: break-all; text-align: center; color: var(--text-muted); }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 10px 5px 25px 5px;
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 22px; height: 22px; stroke-width: 2; }

        /* --- 1. HIDE ON NORMAL SCREEN (Must be OUTSIDE the print block) --- */
        .print-header { 
            display: none; 
        }

        /* --- 2. SHOW ONLY ON PDF --- */
        @media print {
            .top-nav, .bottom-nav, .input-group, .btn, .nav-tabs, #bulkActions, .hide-on-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .container { padding: 0 !important; }
            .print-only { display: block !important; }
            
            /* Reveal the letterhead and make it a flexbox layout! */
            .print-header { 
                display: flex !important; 
                align-items: center; 
                justify-content: space-between; /* This pushes the logo left and text right */
                border-bottom: 2px solid var(--border); 
                padding-bottom: 15px; 
                margin-bottom: 25px; 
            }

            .barcode-card, .qr-card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
            .bulk-grid { grid-template-columns: 1fr 1fr 1fr; } 
        }
    </style>
</head>
<body>

    <div class="header hide-on-print">
    <button class="menu-btn" onclick="history.back()">
        <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <h1 class="header-title">Saved</h1>
    <div style="width: 26px;"></div>
</div>

    <div class="container">

        <div class="print-header">
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="https://dacpad.in/images/logo.png" alt="DacPad" style="height: 45px !important; max-width: 150px !important; width: auto; object-fit: contain;">
                <div>
                    <h2 style="margin: 0; font-size: 22px; color: var(--primary); letter-spacing: -0.5px;">DacPad</h2>
                    <p style="margin: 2px 0 0 0; font-size: 12px; color: var(--text-muted);">Generated Codes</p>
                </div>
            </div>

            <div style="text-align: right; font-size: 11px; color: var(--text-muted);">
                <p style="margin: 0 0 3px 0; color: var(--primary); font-weight: 600;">DacPad Partner App</p>
                <p style="margin: 0;">contact@dacpad.in</p>
                <p style="margin: 0;">www.dacpad.in/barcode</p>
            </div>

        </div>

        
        <div id="page-saved" class="page active">
            
            <div class="input-group hide-on-print">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin: 0;">Enter Tracking ID / Code</label>
                    <button class="btn btn-outline" style="width: auto; padding: 4px 10px; font-size: 11px; border-radius: 6px;" onclick="pasteFromClipboard('saveInput')">📋 Paste</button>
                </div>
                
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="saveInput" placeholder="e.g. FMP123456789">
                    <button class="btn" style="width: auto; padding: 0 20px;" onclick="saveBarcodeToMemory()">Save</button>
                </div>
            </div>

            <div id="bulkActions" style="display: none; justify-content: space-between; align-items: center; margin-top: 15px; padding: 12px; background: var(--surface); border-radius: 12px; border: 1.5px solid var(--border);">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="selectAllCb" onclick="toggleSelectAll(this)" style="width: 18px; height: 18px; accent-color: var(--accent);">
                    <label for="selectAllCb" style="margin: 0; font-size: 14px; text-transform: none; color: var(--primary);">Select All</label>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-outline" style="width: auto; padding: 8px 12px; font-size: 13px;" onclick="window.print()">Print Sheet</button>
                    <button class="btn btn-danger" style="width: auto; font-weight: bold;" onclick="deleteSelectedBarcodes()">Delete</button>
                </div>
            </div>
            
            <div class="saved-list" id="savedContainer">
                </div>
        </div>

        <div id="page-bulk-bar" class="page">
            <div class="input-group hide-on-print">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin: 0;">Enter multiple codes</label>
                    <button class="btn btn-outline" style="width: auto; padding: 4px 10px; font-size: 11px; border-radius: 6px;" onclick="pasteFromClipboard('bulkBarInput')">📋 Paste</button>
                </div>
                <textarea id="bulkBarInput" placeholder="369874521064&#10;345698721032" onpaste="setTimeout(() => { if(!this.value.endsWith('\n')) this.value += '\n'; }, 10)"></textarea>
            </div>
            <div style="display: flex; gap: 10px;" class="hide-on-print">
                <button class="btn" onclick="generateBulkBarcodes()">Generate</button>
                <button id="printBarBtn" class="btn btn-outline" style="display: none;" onclick="window.print()">Print Sheet</button>
            </div>
            
            <div class="saved-list" id="bulkBarContainer"></div>
        </div>

        <div id="page-bulk-qr" class="page">
            <div class="input-group hide-on-print">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="margin: 0;">Enter URLs or Text</label>
                    <button class="btn btn-outline" style="width: auto; padding: 4px 10px; font-size: 11px; border-radius: 6px;" onclick="pasteFromClipboard('bulkQrInput')">📋 Paste</button>
                </div>
                <textarea id="bulkQrInput" placeholder="https://dacpad.in&#10;UPI ID or Mobile Number" onpaste="setTimeout(() => { if(!this.value.endsWith('\n')) this.value += '\n'; }, 10)"></textarea>
            </div>
            <div style="display: flex; gap: 10px;" class="hide-on-print">
                <button class="btn" onclick="generateBulkQRCodes()">Generate</button>
                <button id="printQrBtn" class="btn btn-outline" style="display: none;" onclick="window.print()">Print Sheet</button>
            </div>
            
            <div class="bulk-grid" id="bulkQrContainer"></div>
        </div>

    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('page-saved', this, 'Saved')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Saved
        </div>
        <div class="nav-item" onclick="switchPage('page-bulk-bar', this, 'Bulk Barcode')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            Bulk Bar
        </div>
        <div class="nav-item" onclick="switchPage('page-bulk-qr', this, 'Bulk QR')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><rect x="7" y="7" width="3" height="3"></rect><rect x="14" y="7" width="3" height="3"></rect><rect x="7" y="14" width="3" height="3"></rect><rect x="14" y="14" width="3" height="3"></rect></svg>
            Bulk QR
        </div>
    </div>

    <script>
        // --- 1. NAVIGATION LOGIC ---
        function switchPage(pageId, navElement, title) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navElement.classList.add('active');
            
            document.getElementById('pageTitle').innerText = title;
        }

        // --- 2. MY CODES LOGIC (With Checkboxes & Numbering) ---
        let savedBarcodes = JSON.parse(localStorage.getItem('dacpad_saved_barcodes') || '[]');

        function renderSavedBarcodes() {
            const container = document.getElementById('savedContainer');
            const bulkActions = document.getElementById('bulkActions');
            container.innerHTML = '';

            if (savedBarcodes.length === 0) {
                bulkActions.style.display = 'none';
                container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">No barcodes saved yet.</div>';
                return;
            }

            bulkActions.style.display = 'flex';
            document.getElementById('selectAllCb').checked = false;

            // Total count to generate the numbering (Highest number at the top)
            let total = savedBarcodes.length;

            savedBarcodes.forEach((code, index) => {
                const card = document.createElement('div');
                card.className = 'barcode-card';
                card.innerHTML = `
                    <div class="hide-on-print" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1.5px solid var(--border); padding-bottom: 12px; margin-bottom: 15px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" class="bulk-cb" value="${index}" style="width: 18px; height: 18px; accent-color: var(--accent);">
                            <div style="background: var(--bg); padding: 4px 10px; border-radius: 6px; font-weight: 800; color: var(--primary); font-size: 14px;">#${index + 1}</div>
                        </div>
                        <button class="btn btn-danger" style="padding: 6px 12px; font-size: 13px; width: auto;" onclick="deleteSingleBarcode(${index})">Delete</button>
                    </div>

                    <div class="print-only" style="display: none; font-weight: 800; color: var(--text-muted); font-size: 12px; text-align: left; margin-bottom: 5px;">#${index + 1}</div>
                    
                    <svg id="saved-svg-${index}"></svg>
                `;
                container.appendChild(card);
                JsBarcode(`#saved-svg-${index}`, code, { format: "CODE128", width: 2, height: 60, displayValue: true });
            });
        }

        function saveBarcodeToMemory() {
            const input = document.getElementById('saveInput');
            const val = input.value.trim();
            if (!val) return;
            if (savedBarcodes.includes(val)) {
                alert("This code is already generated!");
                input.value = '';
                return;
            }
            
            savedBarcodes.unshift(val); // Adds to the top of the array
            localStorage.setItem('dacpad_saved_barcodes', JSON.stringify(savedBarcodes));
            input.value = ''; 
            renderSavedBarcodes();
        }

        // --- BULK DELETE LOGIC ---
        function toggleSelectAll(source) {
            const checkboxes = document.querySelectorAll('.bulk-cb');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        function deleteSelectedBarcodes() {
            const checkboxes = document.querySelectorAll('.bulk-cb:checked');
            if (checkboxes.length === 0) return alert("Please select at least one barcode to delete.");

            if (confirm(`Are you sure you want to delete ${checkboxes.length} selected barcode(s)?`)) {
                // Get values and sort numerically descending so indices don't shift while splicing
                let indices = Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a, b) => b - a);
                indices.forEach(idx => savedBarcodes.splice(idx, 1));
                
                localStorage.setItem('dacpad_saved_barcodes', JSON.stringify(savedBarcodes));
                renderSavedBarcodes();
            }
        }

        function deleteSingleBarcode(index) {
            if(confirm("Delete this saved barcode?")) {
                savedBarcodes.splice(index, 1);
                localStorage.setItem('dacpad_saved_barcodes', JSON.stringify(savedBarcodes));
                renderSavedBarcodes();
            }
        }

        window.onload = () => {
            renderSavedBarcodes();
        };


        // --- 3. BULK BARCODE GENERATOR ---
        function generateBulkBarcodes() {
            const container = document.getElementById('bulkBarContainer');
            container.innerHTML = '';
            
            const lines = document.getElementById('bulkBarInput').value.split('\n').filter(line => line.trim() !== '');
            if(lines.length === 0) return alert("Please enter at least one code.");

            // NEW: Reveal the Print Button!
            document.getElementById('printBarBtn').style.display = 'flex';

            lines.forEach((code, index) => {
                const card = document.createElement('div');
                card.className = 'barcode-card';
                card.style.padding = '10px';
                card.innerHTML = `
                    <div style="font-weight: 800; color: var(--text-muted); font-size: 12px; text-align: left; margin-bottom: 5px;">#${index + 1}</div>
                    <svg id="bulk-svg-${index}"></svg>
                `;
                container.appendChild(card);
                JsBarcode(`#bulk-svg-${index}`, code.trim(), { format: "CODE128", width: 2, height: 50, displayValue: true });
            });
        }

        // --- 4. BULK QR CODE GENERATOR ---
        function generateBulkQRCodes() {
            const container = document.getElementById('bulkQrContainer');
            container.innerHTML = ''; 
            
            const lines = document.getElementById('bulkQrInput').value.split('\n').filter(line => line.trim() !== '');
            if(lines.length === 0) return alert("Please enter at least one link or text.");

            // NEW: Reveal the Print Button!
            document.getElementById('printQrBtn').style.display = 'flex';

            lines.forEach((text, index) => {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `
                    <div style="width: 100%; font-weight: 800; color: var(--text-muted); font-size: 12px; text-align: left; margin-bottom: 10px;">#${index + 1}</div>
                    <div id="qrcode-${index}"></div>
                    <div class="qr-label" style="margin-top: 10px;">${text.trim()}</div>
                `;
                container.appendChild(card);
                new QRCode(document.getElementById(`qrcode-${index}`), {
                    text: text.trim(), width: 128, height: 128, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                });
            });
        }
        
        // --- 6. SMART CLIPBOARD PASTE ---
        async function pasteFromClipboard(targetId) {
            try {
                // Ask the browser to read the phone's clipboard
                const text = await navigator.clipboard.readText();
                
                if (text) {
                    const inputElement = document.getElementById(targetId);
                    
                    // 1. Is it a multi-line box? (Bulk Tabs)
                    if (inputElement.tagName === 'TEXTAREA') {
                        if (inputElement.value.trim() !== '' && !inputElement.value.endsWith('\n')) {
                            inputElement.value += '\n';
                        }
                        inputElement.value += text + '\n';
                    } 
                    // 2. Or is it a single-line box? (Saved Tab)
                    else {
                        inputElement.value = text.trim(); 
                        
                        // PRO UX FEATURE: Automatically save it instantly!
                        if(targetId === 'saveInput') {
                            saveBarcodeToMemory();
                        }
                    }
                    
                } else {
                    alert("Your clipboard is empty!");
                }
            } catch (err) {
                console.error('Failed to read clipboard contents: ', err);
                alert("Please manually long-press the box and select 'Paste'. Your browser blocked automatic pasting.");
            }
        }
    </script>
</body>
</html>
